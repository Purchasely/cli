[package]
name = "purchasely"
version = "0.7.2"
edition = "2024"
rust-version = "1.99"

[lib]
path = "src/lib.rs"

[[bin]]
name = "purchasely"
path = "src/main.rs"

[dependencies]
ureq = { version = "=3.1.4", default-features = false, features = ["rustls", "gzip"] }
sha2 = "0.10"
getrandom = "0.3"
libc = "0.2"
webpki-roots = "=1.0.12"
rustls-pki-types = { version = "1", features = ["std"] }
