name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The man page lint test needs mandoc; macOS ships it in /usr/bin.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mandoc
      # The binary contract suite runs target/debug/purchasely: build it first.
      - run: cargo build -p purchasely --bins
      # release::bridge_tgz_accepted_by_old_installer runs the frozen installer of the Node CLI (before the bridge),
      # which needs Node 22.12 or newer from the runner image (`which node`). The CLI itself needs no Node.
      - run: cargo test --workspace
