name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y mandoc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -p purchasely -- -D warnings
      # The man page lint test needs mandoc; macOS ships it in /usr/bin.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mandoc
      # The binary contract suite runs target/debug/purchasely: build it first.
      - run: cargo build -p purchasely --bins
      # The inventory test checks each `unit` of the case files against these lists. The same job runs
      # every listed test next, so a listed test that is not ignored ran.
      # rust-toolchain sets CARGO_TERM_COLOR=always: the parser needs plain `Running tests/<file>.rs` lines.
      - name: List the workspace tests
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo test --workspace -- --list > target/test-list.txt 2>&1
          cargo test --workspace -- --list --ignored > target/test-list-ignored.txt 2>&1
      - run: cargo test --workspace
