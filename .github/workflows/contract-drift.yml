name: Contract drift

# Temporary until the cut-over (plan 2.6): re-record the TS suite and compare it with the committed cases.
on:
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.99.1
      - run: sudo apt-get update && sudo apt-get install -y mandoc zsh fish
      - run: npm ci
      - run: CONTRACT_RECORD=$RUNNER_TEMP/cases npx vitest run
      - run: CONTRACT_DRIFT_DIR=$RUNNER_TEMP/cases cargo test -p contract --test drift -- --nocapture
